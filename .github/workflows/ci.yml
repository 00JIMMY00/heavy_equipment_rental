name: Test, build, deploy HER

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: her-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.changes.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect runtime changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          runtime_changed=true
          if [[ "$GITHUB_EVENT_NAME" == push && "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BEFORE^{commit}"; then
            runtime_changed=false
            git diff --name-only -z "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/her-changes"
            while IFS= read -r -d '' path; do
              case "$path" in
                docs/*|*.md) ;;
                *) runtime_changed=true ;;
              esac
            done < "$RUNNER_TEMP/her-changes"
          fi
          echo "runtime_changed=$runtime_changed" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m compileall -q heavy_equipment_rental deploy
      - run: python -m unittest deploy.test_rollout
      - name: Build calendar
        working-directory: frontend
        run: npm ci && npm run build
      - name: Validate compose configuration
        env:
          APP_IMAGE: local/her:test
          DB_PASSWORD: config-validation-only
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/ci.compose.yaml config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: |
            heavy_equipment_rental/public/frontend
            heavy_equipment_rental/www/rental_calendar.html
          retention-days: 1

  image:
    if: needs.validate.outputs.runtime_changed == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: heavy_equipment_rental
      - uses: docker/setup-buildx-action@v3
      - name: Build production image using cached dependencies
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          load: true
          tags: ghcr.io/00jimmy00/heavy_equipment_rental:sha-${{ github.sha }}
          build-args: APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=her-v15
          cache-to: type=gha,mode=max,scope=her-v15
      - name: Verify exact application revision
        env:
          APP_IMAGE: ghcr.io/00jimmy00/heavy_equipment_rental:sha-${{ github.sha }}
        run: |
          docker run --rm --entrypoint cat "$APP_IMAGE" apps/heavy_equipment_rental/.source-commit | grep -Fx "$GITHUB_SHA"
      - name: Test installation, migrations and critical rental workflows in the production image
        env:
          APP_IMAGE: ghcr.io/00jimmy00/heavy_equipment_rental:sha-${{ github.sha }}
        run: docker compose -f deploy/ci.compose.yaml up --abort-on-container-exit --exit-code-from test test
      - name: Remove disposable CI database
        if: always()
        env:
          APP_IMAGE: ghcr.io/00jimmy00/heavy_equipment_rental:sha-${{ github.sha }}
        run: docker compose -f deploy/ci.compose.yaml down --volumes --remove-orphans
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested immutable image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: publish
        env:
          IMAGE: ghcr.io/00jimmy00/heavy_equipment_rental:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE" | tee /tmp/her-push.log
          digest=$(awk '/digest: sha256:/ {print $3}' /tmp/her-push.log | tail -1)
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify, restoring the previous release on failure
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.image.outputs.ref }}
        run: bash deploy/remote.sh
