name: Build and deploy release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify_ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a release tag on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  tests:
    needs: verify_ref
    uses: ./.github/workflows/ci.yml

  image:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.digest.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Select commit image tag
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Render client manifests
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python -m pip install PyYAML==6.0.3
          python deploy/make_apps_json.py
          python -m unittest deploy.test_rollout

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Verify built frontend assets are committed
        run: |
          git diff --exit-code -- heavy_equipment_rental/public/frontend heavy_equipment_rental/www/rental_calendar.html
          test -z "$(git ls-files --others --exclude-standard -- heavy_equipment_rental/public/frontend heavy_equipment_rental/www/rental_calendar.html)"

      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: d84154ae23ab7ae756dfe942e3f24dcd70d1fbda
          path: frappe_docker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file frappe_docker/images/layered/Containerfile \
            --build-arg FRAPPE_BRANCH=version-15 \
            --build-arg "CACHE_BUST=$GITHUB_SHA" \
            --secret id=apps_json,src=/tmp/apps.json \
            --tag "$IMAGE:$TAG" \
            --load frappe_docker

      - name: Smoke test image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run --rm --entrypoint bash "$IMAGE:$TAG" -lc \
            'test -d apps/heavy_equipment_rental && test -f sites/apps.txt && test -f apps/heavy_equipment_rental/heavy_equipment_rental/www/rental_calendar.html'

      - name: Publish image and capture digest
        id: digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "$IMAGE:$TAG"
          digest="$(docker buildx imagetools inspect --raw "$IMAGE:$TAG" | sha256sum | cut -d ' ' -f 1)"
          echo "image_ref=$IMAGE@sha256:$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Render client manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python -m pip install PyYAML==6.0.3
          python deploy/make_apps_json.py
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/remote.sh
