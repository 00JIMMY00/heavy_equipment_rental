<main class="insights">
  <header class="hero">
    <div class="hero-content">
    <h1 data-t="Fleet overview"></h1>
    <p class="stamp"></p></div>
  </header>
  <div class="toolbar"><h2 data-t="Performance overview"></h2><div class="periods" role="group"></div></div>
  <p class="notice" role="status"></p>
  <section class="results" hidden>
    <div class="metrics"></div>
    <article class="panel expense-panel">
      <div class="expense-head"><h2 data-t="Expenses by crane"></h2><span class="expense-period"></span></div>
      <p class="caption" data-t="Crane-linked Grouped Expense rows by posting date"></p>
      <div class="expense-ledger"></div>
    </article>
    <div class="charts">
      <article class="panel activity"><div class="heading"><span class="signal"></span><h2 data-t="Billable hours trend"></h2></div>
        <p class="caption" data-t="Submitted hours by timesheet end date"></p><div class="plot"></div></article>
      <article class="panel"><h2 data-t="Fleet condition"></h2><p class="caption" data-t="Current crane master records"></p>
        <div class="condition"></div></article>
    </div>
    <article class="panel ranking"><h2 data-t="Leading cranes"></h2><p class="caption" data-t="Ranked by billable hours in the selected period"></p><div class="leaders"></div></article>
  </section>
</main>
